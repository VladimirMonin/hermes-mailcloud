name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  actions: read
  contents: read

jobs:
  build-and-verify:
    name: Verify release identity and build once
    runs-on: ubuntu-latest
    outputs:
      artifact_sha256: ${{ steps.artifact.outputs.sha256 }}
      release_commit: ${{ steps.identity.outputs.commit }}
      release_tag: ${{ steps.identity.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - name: Require an annotated tag, matching version, and accepted CI
        id: identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = "tag"
          release_commit="$(git rev-list -n 1 "$RELEASE_TAG")"
          test "$(git rev-parse HEAD)" = "$release_commit"
          test "$GITHUB_SHA" = "$release_commit"
          version="$(python -c "import tomllib; from pathlib import Path; print(tomllib.loads(Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version'])")"
          test "$RELEASE_TAG" = "v$version"
          successful_runs="$(gh api --method GET \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$release_commit&status=completed" \
            --jq '[.workflow_runs[] | select(.conclusion == "success")] | length')"
          test "$successful_runs" -gt 0
          printf 'commit=%s\n' "$release_commit" >> "$GITHUB_OUTPUT"
          printf 'tag=%s\n' "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
      - name: Build distributions once from the tagged commit
        run: uv build
      - name: Validate artifact metadata and payload
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from email.parser import BytesParser
          from pathlib import Path
          import tarfile
          import zipfile

          dist = Path("dist")
          wheels = list(dist.glob("hermes_mailcloud-0.1.0a0-*.whl"))
          sdists = list(dist.glob("hermes_mailcloud-0.1.0a0.tar.gz"))
          assert len(wheels) == len(sdists) == 1, (wheels, sdists)
          with zipfile.ZipFile(wheels[0]) as archive:
              names = set(archive.namelist())
              metadata_name = next(name for name in names if name.endswith(".dist-info/METADATA"))
              metadata = BytesParser().parsebytes(archive.read(metadata_name))
              assert metadata["Name"] == "hermes-mailcloud"
              assert metadata["Version"] == "0.1.0a0"
              assert metadata["License-Expression"] == "MIT"
              assert set(metadata.get_all("License-File", [])) == {
                  "LICENSE",
                  "THIRD_PARTY_NOTICES.md",
              }
              assert any(name.endswith(".dist-info/licenses/LICENSE") for name in names)
              assert any(
                  name.endswith(".dist-info/licenses/THIRD_PARTY_NOTICES.md") for name in names
              )
          with tarfile.open(sdists[0], "r:gz") as archive:
              names = set(archive.getnames())
              assert any(name.endswith("/LICENSE") for name in names)
              assert any(name.endswith("/THIRD_PARTY_NOTICES.md") for name in names)
          PY
      - name: Record exact build artifact digest
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          digest="$(python - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          digest = sha256()
          for path in sorted(Path("dist").glob("*")):
              if path.is_file():
                  digest.update(path.name.encode("utf-8"))
                  digest.update(b"\0")
                  digest.update(path.read_bytes())
          print(digest.hexdigest())
          PY
          )"
          printf 'sha256=%s\n' "$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: hermes-mailcloud-${{ steps.identity.outputs.commit }}
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish verified artifact through Trusted Publishing
    needs: build-and-verify
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: hermes-mailcloud-${{ needs.build-and-verify.outputs.release_commit }}
          path: dist
      - name: Verify artifact handoff digest
        shell: bash
        run: |
          set -euo pipefail
          digest="$(python - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          digest = sha256()
          for path in sorted(Path("dist").glob("*")):
              if path.is_file():
                  digest.update(path.name.encode("utf-8"))
                  digest.update(b"\0")
                  digest.update(path.read_bytes())
          print(digest.hexdigest())
          PY
          )"
          test "$digest" = "${{ needs.build-and-verify.outputs.artifact_sha256 }}"
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
