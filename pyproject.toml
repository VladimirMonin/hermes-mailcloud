[project]
name = "hermes-mailcloud"
version = "0.1.0a0"
description = "Agent CLI for Mail.ru Cloud — rclone-backed, JSON-first, safety-aware"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "Vladimir" },
]
keywords = ["mailru", "cloud", "rclone", "cli", "agent"]
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "typer>=0.12,<1.0",
    "rich>=13,<15",
]

[project.scripts]
hermes-mailcloud = "hermes_mailcloud.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hermes_mailcloud"]

[tool.uv]
package = true

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
markers = [
    "live: tests that hit real Mail.ru Cloud via rclone (deselect with '-m \"not live\"')",
]

[dependency-groups]
dev = [
    "jsonschema>=4.23,<5",
]
